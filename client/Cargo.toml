[workspace]
# The root package is the only member today. Later crates (meshing, assets,
# world streaming) get added here rather than becoming separate workspaces, so
# `cargo <gate> --workspace` keeps meaning "everything the client is".
resolver = "3"

[package]
name = "voxelheim-client"
version = "0.1.0"
edition = "2024"
# Pinned in lockstep with rust-toolchain.toml. Bevy 0.19 needs >= 1.95.0, so the
# floor is not decorative.
rust-version = "1.97"
description = "Voxelheim client — rendering, input and prediction for the authoritative Go server"
license = "Apache-2.0"
publish = false

[dependencies]
# Three dependencies, all GDD-level architecture. A fourth needs a discussion,
# not a commit — see client/AGENTS.md.
#
# `default-features = false` plus an explicit list, because Bevy's `default`
# feature is `2d + 3d + ui + audio`: it drags in glTF, PBR, animation, image
# codecs and rodio, none of which this client uses yet, and audio additionally
# needs ALSA headers at build time. The curated bundles below are Bevy's own
# coherent feature sets, so this is a subset of a supported configuration rather
# than a hand-rolled one:
#   ui_api        -> default_app (async executor, asset, log, state, reflect) +
#                    common_api (camera, color, image, mesh, text, window, png) +
#                    bevy_ui
#   ui_bevy_render-> bevy_render + bevy_core_pipeline + bevy_ui_render
# `bevy_winit` + `x11` give a window on Linux; `default_font` gives the embedded
# fallback font, so the status text needs no asset pipeline (explicitly out of
# scope for this issue).
#
# The feature list is bounded by what CI's `client` job installs — read it from
# .github/workflows/ci.yml, never from a local build succeeding, because a
# developer desktop carries development headers a runner does not. Today that
# budget is `libasound2-dev libudev-dev pkg-config`, and every feature here needs
# *none* of them: nothing in this graph asks pkg-config for anything.
#
# `x11` and not `wayland`, deliberately. `x11` links nothing at build time —
# winit reaches libX11 through `x11-dl`, which dlopens at runtime — whereas
# `wayland` pulls `wayland-sys`, whose build script needs `wayland-client.pc`
# from libwayland-dev. That package is not installed in CI and legacy issue 6 puts that
# job's setup out of scope, so the feature set matches the dependencies CI has
# rather than the reverse. On a Wayland desktop the client runs through XWayland;
# see "Known gaps" in client/AGENTS.md.
# `bevy_pbr` is the one feature chunk rendering adds, and it is the smallest thing
# that provides a lit 3D material: `StandardMaterial`, `MeshMaterial3d`,
# `DirectionalLight`. `Camera3d`, `Mesh3d` and the mesh/material plumbing were
# already here — `ui_bevy_render` brings `bevy_core_pipeline` and `common_api`
# brings `bevy_mesh` + `bevy_material` — so this is a genuinely narrow addition
# rather than the `3d_bevy_render` bundle, which would also drag in glTF,
# animation, anti-aliasing and post-processing that nothing renders.
#
# Deliberately *not* `tonemapping_luts`. `Camera3d`'s default tonemapper is
# `TonyMcMapface`, which needs a KTX2 LUT and would pull `ktx2` + `bevy_image/zstd`
# into the graph for one texture; the camera in world/render.rs asks for
# `Tonemapping::AcesFitted` instead, which is computed in the shader and needs no
# asset at all. See "Toolchain and dependencies" in client/AGENTS.md.
bevy = { version = "0.19.1", default-features = false, features = [
    "bevy_pbr",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "ui_api",
    "ui_bevy_render",
    "x11",
] }

# Version-matched to the flatc release pinned in .flatc-version at the repo root.
# The runtime and the generator move together; a mismatch is a decode bug that
# only shows up on the wire.
flatbuffers = "=25.12.19"

# The third crate, and the discussion client/AGENTS.md asks for is on the record
# rather than waived. **Fabio decided it on 2026-08-20** (legacy issue 157), over the
# alternative of leaving the wire in the clear and documenting a WireGuard or VPN
# deployment, on the grounds that encryption in the binary is substantially more
# solid than a tunnel. The reasoning is the part that generalises: a tunnel
# protects only when every operator configures one correctly and every player
# joins it, and it silently protects nothing when either does not happen.
# Encryption in the transport protects by default, and its failure mode is a
# refused connection rather than an unnoticed exposure. There is no flag to turn
# it off on either side, for the same reason.
#
# The two halves are asymmetric and only this one costs anything: the server uses
# crypto/tls from Go's standard library and server/go.mod still has a single
# dependency.
#
# `ring` and not `aws-lc-rs`, with `default-features = false` so the choice is
# stated rather than inherited — rustls's provider default has moved between
# releases, and a crypto backend that changes under a toolchain upgrade is one
# nobody reviewed. Both build here: `cc`, `gcc`, `cmake` and `perl` are present on
# the ubuntu-latest runner image and on the development box, so neither would
# change the apt list CI installs (`libasound2-dev libudev-dev pkg-config`).
# `ring` is the lighter of the two — it needs `cc` alone, where `aws-lc-rs` also
# wants cmake and perl — and the feature budget this file keeps says take the
# lighter one. **Verified against the built tree, not against this paragraph**:
# `cargo tree` shows `ring` and no `aws-lc-sys`.
#
# No `tls12`: both ends of this wire are ours, the server's floor is
# `tls.VersionTLS13`, and there is no browser or legacy client to accommodate — so
# 1.2 buys nothing and costs a negotiable downgrade. `logging` is off because
# rustls would otherwise pull `log` to describe handshakes nothing here reads.
#
# `rustls::pki_types` re-exports what a custom verifier needs, so this stays one
# crate rather than one plus `rustls-pki-types`.
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }

# No `[lints] unsafe_code = "forbid"`, deliberately: flatc's output is full of
# `unsafe` accessor bodies, and a crate-level `forbid` cannot be relaxed by an
# `#[allow]` on the generated module. The rule that matters is enforced by review
# instead — hand-written client code contains no `unsafe`, and in particular
# net/codec.rs uses the verifying `root_as_envelope`, never
# `root_as_envelope_unchecked`.

# ── Build profiles ─────────────────────────────────────────────────────────────
#
# Until #650 this file declared no `[profile.*]` section at all, so `cargo run` and
# `cargo test` used Cargo's stock `dev` profile: `opt-level = 0` for this crate **and
# for every dependency**, Bevy included. #642 measured what that costs on one
# operation — expanding and storing one chunk was 0.026–0.044 ms in an optimized build
# and 0.26–0.46 ms in an unoptimized one. A factor of ten between two builds of the
# same source, before a second machine enters the picture.
#
# The cost lands on judgement rather than on patience. A frame budget tuned against the
# slow column over-corrects for the fast one, and a regression only the slow column can
# see is indistinguishable from a real one until somebody builds twice — which is why
# every number in `world/mod.rs`'s budget argument had to be carried in two columns,
# and why the walking hitch in #629 was reported by somebody playing the game rather
# than by a profiler.
#
# **Why two stanzas, and why they carry different numbers.** They answer two halves of
# the build that are priced differently. Dependencies are compiled once and then
# cached, so `opt-level = 3` there is paid on a cold build and never again — and that
# is the half carrying Bevy, whose scheduling, transform propagation and render
# extraction run every frame in code this crate does not own. This crate is recompiled
# on every edit, so it takes `opt-level = 1` instead: enough that the hot loops the
# client does own — `VoxelChunk::from_runs`, the greedy mesher — stop being a different
# game from the one that ships, and cheap enough that the edit-rebuild-look loop this
# profile exists to protect stays short.
#
# Bevy documents this exact pair as its recommended development setup. The reasoning
# above is why it applies here rather than the fact that it is recommended: an engine
# crate that runs per frame and a game crate that is rebuilt per edit want different
# answers, and Cargo's per-package override is the only thing that lets one profile
# give both.
#
# **Measured on one 16-core Linux desktop, three runs each, reported as ranges.** A
# wall clock on one machine is a reading and not a bound; what is being claimed is the
# direction and the rough size, not the seconds.
#
# | | stock dev | this profile |
# | --- | --- | --- |
# | incremental rebuild, one line in `client/src/` | 7.42–7.45 s | **5.42–5.68 s** |
# | `cargo test --workspace --locked`, binaries warm | 10.69–10.84 s | **1.81–1.87 s** |
# | expanding + storing one chunk (#642's measurement) | 0.283–0.289 ms | **0.046–0.069 ms** |
# | clean debug build | 141–170 s | 298–338 s |
# | `target/` after that build | 5.89 GiB | 7.02 GiB |
# | the whole ci.yml client gate sequence, cold | 302 s | 525 s |
#
# **The first row is the one that decides this, and it goes the right way.** The
# edit-rebuild loop got *shorter*, by about two seconds in seven: this crate at
# `opt-level = 1` costs a little more to codegen and the linker is handed a much
# smaller pile of unoptimized dependency code, and the second effect is larger than the
# first. The test suite is the other number a developer actually waits on, and it is
# five and a half times faster.
#
# **What it costs is the cold build, and only the cold build**: 1.7x on the full gate
# sequence, paid on a fresh checkout, a toolchain bump or a lockfile change. On CI that
# is a cache miss, which is the case `client-cache.yml` exists to make rare. Measured on
# a hosted runner, this branch's own cold `client` job took **23m16s** against a budget
# of 25 minutes — 104 seconds of margin — so the budget moved to 40 in `ci.yml` and
# `client-cache.yml` together, with `scripts/test/client-ci-budget.test.sh` pinning both.
# That is the number to re-measure if the job ever runs close to it again.
#
# **Where the chunk figure lands, stated rather than rounded off.** 0.046–0.069 ms is
# not the 0.026–0.044 ms of a release build, because this crate is at `opt-level = 1`
# and not 3. It is a fifth of what it was and within about a factor of two of what
# ships, which is close enough that a measurement taken here is about the code. It is
# not close enough to quote as a release number, and no number taken under this profile
# may be.
#
# **What would have to change for this to be revisited.** If the cold build ever
# threatens the CI budget, `opt-level = 2` on dependencies is the first thing to try —
# most of the win, materially less codegen. If a debugger session through Bevy's own
# frames is ever needed, `opt-level = 3` there is what makes those frames unreadable,
# and the fix is a one-line local override rather than a change here.
#
# The release profile is deliberately absent: nothing here changes what ships, and
# `--release` remains the build every number quoted as "optimized" comes from.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
